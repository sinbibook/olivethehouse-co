<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>대부도 올리브 더하우스 독채 풀빌라 펜션</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="대부도 올리브 더하우스 독채 풀빌라 펜션" />
  <meta property="og:description" content="프라이빗하게 아무에게도 방해받지 않고 우리만의 추억을 남길 수 있는 공간 대부도 올리브 독채 풀빌라 입니다." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2025/11/06/lV4frbIBUmLQ.jpg" />
  <meta property="og:url" content="https://olivethehouse.co.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="대부도 올리브 더하우스 독채 풀빌라 펜션" />
  <meta name="twitter:description" content="프라이빗하게 아무에게도 방해받지 않고 우리만의 추억을 남길 수 있는 공간 대부도 올리브 독채 풀빌라 입니다." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2025/11/06/lV4frbIBUmLQ.jpg" />
  <meta name="naver-site-verification" content="afb4acf37cc984688e257d8151292bff0e4e3843" />
  <meta name="google-site-verification" content="tD6ZSnNT8IJRi5yxyGBsuisySkf-kAJm4QikOQA8ho4" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 room.html 의 목록 화면(#content.sub2_1)이다.
             .sub2_1 스코프가 .room_list 를 2열 float 그리드로 바꾸고 화살표를
             숨기므로 이 페이지에는 Swiper 를 만들지 않는다 (원본 custom.js 와 동일). -->
        <section id="content" class="sub2_1 sub_room">
          <!-- ── 히어로 (hero) — 슬라이더가 아닌 고정 배경 ────────── -->
          <div class="sub_visual_wide" data-layoutmap-hero>
            <div class="visual_box">
              <div class="visual_txt">
                <strong data-layoutmap-hero-title></strong>
                <p data-layoutmap-hero-description></p>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_location_wrap">
            <div class="inner">
              <ul class="location_box">
                <li>홈</li>
                <li>ROOMS</li>
                <li><a href="./layout-map.html">미리보기</a></li>
              </ul>
              <!-- 객실 탭. '미리보기' li 는 정적이고 뒤로 renderRoomNav 가 생성한다.
                   그룹이 있으면 그룹명이, 없으면 객실명이 항목이 된다. -->
              <ul class="cate_box" data-layoutmap-room-nav>
                <li class="on"><a href="./layout-map.html">미리보기</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont inner">
            <!-- ── 배치도 (about) ──────────────────────────────── -->
            <div class="sub_title_box">
              <h3 data-layoutmap-title></h3>
              <p data-layoutmap-description></p>
            </div>
            <div class="wide_img" data-layoutmap-images></div>

            <!-- ── 객실 목록 (roomtypes) ───────────────────────── -->
            <div class="main_room">
              <div class="title_box">
                <h3>ROOMS LIST</h3>
                <p data-layoutmap-room-lead></p>
              </div>
              <div class="room_list">
                <div class="swiper-container">
                  <div class="swiper-wrapper" data-layoutmap-room-slides></div>
                </div>
                <!-- .sub2_1 스코프가 display:none 으로 숨긴다. 2열 그리드라 넘길 게 없다.
                     원본 마크업을 그대로 두어 다른 페이지와 구조를 맞춘다. -->
                <div class="arw_box">
                  <div
                    class="swiper-button-prev"
                    style="background: url(images/common/room_pre.png) no-repeat 25% 50% #fff"
                  >
                    Prev
                  </div>
                  <div
                    class="swiper-button-next"
                    style="background: url(images/common/l_le.png) no-repeat 75% 50% #fff"
                  >
                    Next
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>
      <!--// container -->

      <div id="footer-wrap"></div>
    </div>

    <div id="popup-container"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/layout-map-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
